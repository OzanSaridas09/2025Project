<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - Name Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --action-blue: #007bff;
            --bg-gray: #f8f9fa;
        }
        body { background-color: var(--bg-gray); }
        .favorites-container { margin-top: 50px; }
        .card-name { font-weight: bold; font-size: 1.25rem; }
        .star-active { color: #ffc107; cursor: pointer; font-size: 1.5rem; }
        .btn-play { background-color: var(--action-blue); color: white; border-radius: 50px; }
    </style>
</head>
<body>

    <div class="container favorites-container">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <a href="/" class="text-decoration-none text-muted small">← Back to Dashboard</a>
                <h2 class="fw-bold mt-2">⭐ Favorites</h2>
            </div>
            <span class="badge bg-primary rounded-pill">3 Favorited Names</span>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            
            <div class="col" id="fav-card-1">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="card-name">Siobhan</span>
                            <span class="star-active" title="Unfavorite">★</span>
                        </div>
                        <p class="text-muted small">Added on: Jan 20, 2026</p>
                        <button class="btn btn-play w-100 mt-2">
                            <span>▶ Play Audio</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="col" id="fav-card-2">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="card-name">Nguyen</span>
                            <span class="star-active" title="Unfavorite">★</span>
                        </div>
                        <p class="text-muted small">Added on: Jan 18, 2026</p>
                        <button class="btn btn-play w-100 mt-2">
                            <span>▶ Play Audio</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="col" id="fav-card-3">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="card-name">Alejandro</span>
                            <span class="star-active" title="Unfavorite">★</span>
                        </div>
                        <p class="text-muted small">Added on: Jan 15, 2026</p>
                        <button class="btn btn-play w-100 mt-2">
                            <span>▶ Play Audio</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div class="text-center py-5 d-none">
            <h3 class="text-muted">No favorites yet.</h3>
            <p>Click the star on any name to see it here!</p>
            <a href="/" class="btn btn-outline-primary">Search Names</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
