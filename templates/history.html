<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playback History - Name Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --action-blue: #007bff;
            --bg-gray: #f8f9fa;
        }
        body { background-color: var(--bg-gray); }
        .history-container { margin-top: 50px; margin-bottom: 50px; }
        .table-card { border-radius: 15px; overflow: hidden; }
        .btn-delete { color: #dc3545; cursor: pointer; transition: 0.2s; }
        .btn-delete:hover { color: #a71d2a; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="container history-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="/" class="text-decoration-none text-muted small">← Back to Dashboard</a>
                <h2 class="fw-bold mt-2">Playback History</h2>
            </div>
            <button class="btn btn-outline-danger btn-sm">Clear All History</button>
        </div>

        <div class="card table-card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Name</th>
                            <th>Date & Time</th>
                            <th>Phonetic</th>
                            <th>Origin</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="row-1">
                            <td class="ps-4 fw-bold">Siobhan</td>
                            <td>date and time</td>
                            <td>shiv-AWN</td>
                            <td>Irish</td>
                            <td class="text-end pe-4">
                                <span class="btn-delete" title="Delete from history">🗑️</span>
                                <span class="btn" title="Play audio">🔊</span>
                                <span class="btn" title="Favourite name">⭐</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
