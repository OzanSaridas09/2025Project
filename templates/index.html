{% extends "base.html" %}

{% block content %}
<div class="container hero-section">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <form action="/search" method="POST" class="input-group input-group-lg shadow-sm">
                <input type="text" name="query" class="form-control" placeholder="Type a name..." aria-label="Search">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
